spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
# Test-only credentials for the throwaway in-memory H2 database (never reachable over a network).
# Do NOT copy into src/main/resources: production reads ${SPRING_DATASOURCE_PASSWORD} with no default.
spring.datasource.username=test_user
spring.datasource.password=test-only-h2-password
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
